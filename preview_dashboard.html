    <!-- React App component script compiled via Babel -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // No mock data - all vulnerability data comes exclusively from real backend API

        function App() {
            // Decoupled backend base URL (dynamic)
            const API_BASE_URL = "http://localhost:8000";

            const [targetUrl, setTargetUrl] = useState("https://example.com");
            const [cookie, setCookie] = useState("");
            const [isScanning, setIsScanning] = useState(false);
            const [scanProgress, setScanProgress] = useState(0);
            const [hasScanned, setHasScanned] = useState(false);
            const [scanId, setScanId] = useState(null);
            const [activeTab, setActiveTab] = useState("scanner");
            const [selectedVuln, setSelectedVuln] = useState(null);
            
            // Detail tabs: 'impact', 'verification', 'remediation'
            const [detailTab, setDetailTab] = useState("impact");
            const [vulnerabilities, setVulnerabilities] = useState([]);

            // Default logging configurations
            const [consoleLogs, setConsoleLogs] = useState([
                { time: "20:30:01", type: "info", text: "AI Orchestrator initialized. Gemini 2.5 Pro engine mapped." },
                { time: "20:30:02", type: "success", text: "FastAPI gateway connected successfully. CORS credentials loaded." },
                { time: "20:30:02", type: "info", text: "Ready for un-authenticated or authenticated audit requests." }
            ]);

            const consoleEndRef = useRef(null);

            // AI Logic Hunter state
            const [hunterRawTraffic, setHunterRawTraffic] = useState("");
            const [hunterAuthContext, setHunterAuthContext] = useState("");
            const [hunterAnalyzing, setHunterAnalyzing] = useState(false);
            const [hunterResult, setHunterResult] = useState(null);
            const [hunterOutputTab, setHunterOutputTab] = useState("report");
            const [hunterFindingId, setHunterFindingId] = useState(null);
            const [hunterFuzzingActive, setHunterFuzzingActive] = useState(false);
            const [hunterFuzzRecords, setHunterFuzzRecords] = useState([]);
            const [hunterExpandedPayload, setHunterExpandedPayload] = useState(null);
            const hunterPollRef = useRef(null);

            // HAR Batch Ingestion state
            const [hunterInputMode, setHunterInputMode] = useState("single"); // 'single' | 'har'
            const [harUploading, setHarUploading] = useState(false);
            const [harResults, setHarResults] = useState(null); // backend response
            const [harError, setHarError] = useState(null);
            const [harFileName, setHarFileName] = useState("");
            const [harDragOver, setHarDragOver] = useState(false);
            const [readyPulseActive, setReadyPulseActive] = useState(false);
            const harFileInputRef = useRef(null);

            // Step 8: Parallel batch + Identity Provider Anchor state
            const [selectedFindingIds, setSelectedFindingIds] = useState([]);
            const [batchActive, setBatchActive] = useState(false);
            const [reauthDiagnostic, setReauthDiagnostic] = useState(null);
            const [anchorMethod, setAnchorMethod] = useState("POST");
            const [anchorUrl, setAnchorUrl] = useState("");
            const [anchorHeaders, setAnchorHeaders] = useState('{"Content-Type": "application/json"}');
            const [anchorBody, setAnchorBody] = useState('{"username": "", "password": ""}');
            const [dryRunning, setDryRunning] = useState(false);
            const [dryRunResult, setDryRunResult] = useState(null);

            // Cleanup polling on unmount
            useEffect(() => {
                return () => {
                    if (hunterPollRef.current) clearInterval(hunterPollRef.current);
                };
            }, []);

            useEffect(() => {
                consoleEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [consoleLogs]);

            const addLog = (type, text) => {
                const now = new Date();
                const timeStr = now.toTimeString().split(" ")[0];
                setConsoleLogs((prev) => [...prev, { time: timeStr, type, text }]);
            };

            const handleLaunchScan = async (e) => {
                e.preventDefault();
                if (!targetUrl) return;

                setIsScanning(true);
                setScanProgress(0);
                setScanId(null);
                setVulnerabilities([]);
                setSelectedVuln(null);
                setConsoleLogs([]);

                addLog("info", `Initiating connection handshake against target: ${targetUrl}`);
                addLog("info", "Executing dynamic schema verification (Pydantic validator)...");

                try {
                    // Send request to local backend (incorporates 'null' CORS support)
                    const response = await fetch(`${API_BASE_URL}/api/v1/scan/start`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            target_url: targetUrl,
                            cookie: cookie || null
                        })
                    });

                    if (!response.ok) {
                        const errDetails = await response.json();
                        throw new Error(errDetails.detail || "API dispatcher error code received.");
                    }

                    const data = await response.json();
                    const currentScanId = data.scan_id;
                    setScanId(currentScanId);
                    
                    addLog("success", `FastAPI Server Accepted Request. Assigned Scan UUID: ${currentScanId}`);
                    addLog("info", `Spawning isolated Nuclei subprocess securely in background. Shell execution: sandbox protected.`);
                    
                    setScanProgress(15);
                    addLog("info", "Background scanner subprocess successfully spawned. Commencing audit steps...");

                    // Setup database state polling interval (runs every 3 seconds)
                    const pollInterval = setInterval(async () => {
                        try {
                            const statusResp = await fetch(`${API_BASE_URL}/api/v1/scan/${currentScanId}`);
                            if (!statusResp.ok) return;

                            const statusData = await statusResp.json();
                            const currentStatus = statusData.status;

                            addLog("info", `Polling Database State: ${currentStatus.toUpperCase()}`);

                            if (currentStatus === "running") {
                                // Increment progress towards 80%
                                setScanProgress((prev) => (prev < 80 ? prev + 15 : 80));
                                addLog("info", "Audit scanning in progress. Parsing line-by-line JSONL streams...");
                            } else if (currentStatus === "completed" || currentStatus === "failed") {
                                clearInterval(pollInterval);
                                setScanProgress(100);
                                setIsScanning(false);
                                setHasScanned(true);

                                if (currentStatus === "completed") {
                                    addLog("success", `Subprocess scanning finished with status: ${currentStatus.toUpperCase()}`);
                                    addLog("info", "Fetching all parsed vulnerability findings from SQLite database...");

                                    // Pull real database findings
                                    const findingsResp = await fetch(`${API_BASE_URL}/api/v1/scan/${currentScanId}/findings`);
                                    if (findingsResp.ok) {
                                        const findingsData = await findingsResp.json();
                                        addLog("success", `Successfully retrieved ${findingsData.length} finding(s) from database!`);

                                        if (findingsData.length > 0) {
                                            // Map database finding to front-end schema
                                            const formattedFindings = findingsData.map((f) => ({
                                                id: f.template_id.toUpperCase() + "-" + f.id,
                                                name: f.template_id.toUpperCase() + " Vulnerability",
                                                severity: f.severity.toUpperCase(),
                                                path: f.matched_at,
                                                description: `Vulnerability match detected on matched path: ${f.matched_at}. Template definition: ${f.template_id}. Severity rating: ${f.severity}.`,
                                                impactEn: `Critical security alert compiled by scanner template: ${f.template_id}. Exploit gives remote attackers access capability. Check PoC verification traces and AI remediation guidance details.`,
                                                impactZh: `\u626B\u63CF\u7B7E\u540D\u6A21\u5757\uFF1A${f.template_id} \u6210\u529F\u62E6\u622A\u9AD8\u5371\u5A01\u80C1\u7279\u5F81\u3002\u8BE5\u6F0F\u6D1E\u5141\u8BB8\u8FDC\u7A0B\u653B\u51FB\u8005\u83B7\u53D6\u654F\u611F\u670D\u52A1\u64CD\u4F5C\u6743\u9650\uFF0C\u53EF\u80FD\u5A01\u80C1\u6574\u4F53\u4E91\u73AF\u5883\u5BBF\u4E3B\u4E3B\u673A\u3002\u8BF7\u7ACB\u5373\u6839\u636E AI \u9632\u5FA1\u81EA\u6108\u62A5\u544A\u90E8\u7F72\u6F0F\u6D1E\u4FEE\u590D\u3002`,
                                                pocRequest: f.poc_request || "No raw request captured.",
                                                pocResponse: f.poc_response || "No raw response captured.",
                                                ai_patch: f.ai_patch
                                            }));

                                            setVulnerabilities(formattedFindings);
                                            setSelectedVuln(formattedFindings[0]);
                                            
                                            // Re-render lucide icons
                                            setTimeout(() => {
                                                if (window.lucide) window.lucide.createIcons();
                                            }, 200);
                                        } else {
                                            addLog("info", "Audit completed: no critical or high severity vulnerabilities detected. Target is secure. / \u5BA1\u8BA1\u5B8C\u6210\uFF1A\u672A\u53D1\u73B0\u4E25\u91CD\u6216\u9AD8\u5371\u5B89\u5168\u6F0F\u6D1E\u3002\u76EE\u6807\u5B89\u5168\u3002");
                                            setVulnerabilities([]);
                                            setSelectedVuln(null);
                                        }
                                    }
                                } else {
                                    addLog("error", "Background scanner subprocess encountered an execution error.");
                                }
                            }
                        } catch (pollErr) {
                            addLog("error", `Status polling error: ${pollErr.message}`);
                        }
                    }, 3000);

                } catch (error) {
                    addLog("error", `Engine Dispatch Exception: ${error.message}`);
                    addLog("info", "Please ensure the FastAPI backend server is running at the configured API_BASE_URL. / \u8BF7\u786E\u8BA4\u540E\u7AEF FastAPI \u670D\u52A1\u5DF2\u542F\u52A8\u3002");
                    setIsScanning(false);
                    setScanProgress(0);
                }
            };

            // ========== AI Logic Hunter: Utility Functions ==========

            const computeLineDiff = (baseText, testText) => {
                const MAX_CHARS = 20000;
                const MAX_LINES = 250;
                let baseStr = baseText || "";
                let testStr = testText || "";
                const truncated = baseStr.length > MAX_CHARS || testStr.length > MAX_CHARS;
                if (truncated) {
                    baseStr = baseStr.substring(0, MAX_CHARS);
                    testStr = testStr.substring(0, MAX_CHARS);
                }
                const baseLines = baseStr.split("\n").slice(0, MAX_LINES);
                const testLines = testStr.split("\n").slice(0, MAX_LINES);
                const baseSet = new Set(baseLines);
                const testSet = new Set(testLines);
                const diffResult = [];
                baseLines.forEach(line => {
                    if (!testSet.has(line)) {
                        diffResult.push({ type: "del", content: line });
                    } else {
                        diffResult.push({ type: "ctx", content: line });
                    }
                });
                testLines.forEach(line => {
                    if (!baseSet.has(line)) {
                        diffResult.push({ type: "add", content: line });
                    }
                });
                return { lines: diffResult, truncated };
            };

            const generateCurlCommand = (sentRequest) => {
                if (!sentRequest) return "# No request data available";
                const lines = sentRequest.split("\n");
                if (lines.length === 0) return "# No request data available";
                const firstLine = lines[0];
                const match = firstLine.match(/^(\w+)\s+(https?:\/\/\S+)/);
                if (!match) return `# Could not parse: ${firstLine}`;
                const method = match[1];
                const url = match[2];
                let curl = `curl -X ${method}`;
                let bodyStarted = false;
                const headerLines = [];
                const bodyLines = [];
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.trim() === "" && !bodyStarted) { bodyStarted = true; continue; }
                    if (bodyStarted) { bodyLines.push(line); }
                    else if (line.includes(":")) { headerLines.push(line.trim()); }
                }
                headerLines.forEach(h => { curl += ` \\\n  -H '${h}'`; });
                if (bodyLines.length > 0) { curl += ` \\\n  -d '${bodyLines.join("\\n")}'`; }
                curl += ` \\\n  '${url}'`;
                return curl;
            };

            // ========== AI Logic Hunter: API Handlers ==========

            const handleHunterAnalyze = async () => {
                if (!hunterRawTraffic.trim()) return;
                setHunterAnalyzing(true);
                setHunterResult(null);
                setHunterFuzzRecords([]);
                setHunterFuzzingActive(false);
                setHunterFindingId(null);
                addLog("info", "[HUNTER] Submitting raw HTTP traffic for AI Logic Analysis...");
                try {
                    const response = await fetch(`${API_BASE_URL}/api/v1/hunter/analyze`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            raw_traffic: hunterRawTraffic,
                            auth_context_b: hunterAuthContext || null,
                        }),
                    });
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.detail || "Hunter API error");
                    }
                    const data = await response.json();
                    setHunterResult(data);
                    setHunterOutputTab("report");
                    addLog("success", `[HUNTER] AI Analysis complete. ${data.automation_payloads?.length || 0} automation payloads generated.`);
                    setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 200);
                } catch (error) {
                    addLog("error", `[HUNTER] Analysis failed: ${error.message}`);
                    setHunterResult({ status: "error", error_message: error.message, parsed_data: {}, report_markdown: "", automation_payloads: [] });
                } finally {
                    setHunterAnalyzing(false);
                }
            };

            // Step D: persist the current AI analysis (+payloads) as a fuzzable
            // VulnerabilityFinding, then surface it in the verify list so the
            // Hunter -> Verify link is complete.
            const handleSaveHunterFinding = async () => {
                if (!hunterResult || !(hunterResult.automation_payloads?.length > 0)) {
                    addLog("error", "[HUNTER \u00b7 SAVE] Analyze a request that produced payloads first.");
                    return;
                }
                addLog("info", "[HUNTER \u00b7 SAVE] Persisting analysis as a fuzzable finding...");
                try {
                    const anchor = anchorUrl.trim() ? buildAnchorRequest() : null;
                    const resp = await fetch(`${API_BASE_URL}/api/v1/hunter/findings`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            parsed_data: hunterResult.parsed_data || {},
                            automation_payloads: hunterResult.automation_payloads,
                            target_url: null,
                            auth_refresh_request: anchor,
                            report_markdown: hunterResult.report_markdown || null,
                        }),
                    });
                    if (!resp.ok) {
                        const err = await resp.json().catch(() => ({ detail: `HTTP ${resp.status}` }));
                        throw new Error(err.detail || "Persist failed");
                    }
                    const data = await resp.json();
                    const fid = data.finding_id;
                    const pd = hunterResult.parsed_data || {};
                    // id MUST end with the integer finding_id: the verify dropdown
                    // and batch checkboxes derive it via id.split("-").pop().
                    const entry = {
                        id: `HUNTER-${fid}`,
                        name: `Logic Hunter: ${pd.method || "?"} ${pd.path || "/"}`,
                        severity: (hunterResult.automation_payloads[0]?.type || "INFO").toUpperCase(),
                        path: pd.path || "/",
                        description: `AI Logic Hunter analysis persisted as finding #${fid} with ${hunterResult.automation_payloads.length} payload(s).`,
                        pocRequest: hunterRawTraffic || "",
                        pocResponse: "",
                        ai_patch: hunterResult.report_markdown || null,
                    };
                    setVulnerabilities(prev => [entry, ...prev.filter(v => v.id !== entry.id)]);
                    setHunterFindingId(fid);
                    addLog("success", `[HUNTER \u00b7 SAVE] ${data.message}`);
                    setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 150);
                } catch (e) {
                    addLog("error", `[HUNTER \u00b7 SAVE] ${e.message}`);
                }
            };

            const handleTriggerFuzzing = async (findingId) => {
                if (!findingId) return;
                setHunterFuzzingActive(true);
                setHunterFuzzRecords([]);
                setReauthDiagnostic(null);
                setHunterFindingId(findingId);
                addLog("info", `[HUNTER \u00b7 FUZZING] Triggering differential fuzzing for finding #${findingId}...`);
                try {
                    const response = await fetch(`${API_BASE_URL}/api/v1/hunter/verify/${findingId}`, { method: "POST" });
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.detail || "Fuzzing trigger failed");
                    }
                    addLog("success", "[HUNTER \u00b7 FUZZING] Job accepted. Starting 1.5s result polling...");
                    if (hunterPollRef.current) clearInterval(hunterPollRef.current);
                    hunterPollRef.current = setInterval(async () => {
                        try {
                            const pollResp = await fetch(`${API_BASE_URL}/api/v1/hunter/verify/${findingId}/results`);
                            if (!pollResp.ok) return;
                            const records = await pollResp.json();
                            applyPolledRecords(records, findingId);
                            setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 100);
                        } catch (pollErr) { console.warn("[HUNTER POLL]", pollErr); }
                    }, 1500);
                    setTimeout(() => {
                        if (hunterPollRef.current) {
                            clearInterval(hunterPollRef.current);
                            hunterPollRef.current = null;
                            setHunterFuzzingActive(false);
                            addLog("info", "[HUNTER \u00b7 FUZZING] Polling completed.");
                        }
                    }, 120000);
                } catch (error) {
                    addLog("error", `[HUNTER \u00b7 FUZZING] ${error.message}`);
                    setHunterFuzzingActive(false);
                }
            };

            // ========== Step 8: Parallel Batch + Identity Provider Anchor ==========

            // Splits the synthetic re-auth diagnostic (payload_index === -1) out of
            // the real fuzzing records so the payload queue is never disturbed.
            const applyPolledRecords = (records, primaryFindingId) => {
                const diag = records.find(r => r.payload_index === -1 || r.id === "__custody_diagnostic__");
                setReauthDiagnostic(
                    diag ? (diag.diff_details?.analysis_notes
                            || "[RE-AUTHENTICATING] Session expired; executing dynamic auth recovery...")
                         : null
                );
                const real = records.filter(r => r.payload_index >= 0 && r.id !== "__custody_diagnostic__");
                setHunterFuzzRecords(real.map(r => ({ ...r, _statusBadge: r.verification_status || "untested" })));
            };

            const buildAnchorRequest = () => {
                let headers = {};
                try { headers = anchorHeaders.trim() ? JSON.parse(anchorHeaders) : {}; }
                catch (e) { addLog("warn", "[ANCHOR] Headers are not valid JSON; sending empty headers."); }
                let body = null;
                if (anchorBody.trim()) {
                    try { body = JSON.parse(anchorBody); } catch (e) { body = anchorBody; }
                }
                return { method: anchorMethod || "POST", url: anchorUrl.trim(), headers, body };
            };

            const toggleFindingSelection = (id) => {
                const nid = parseInt(id);
                setSelectedFindingIds(prev =>
                    prev.includes(nid) ? prev.filter(x => x !== nid) : [...prev, nid]
                );
            };

            const handleDryRunAnchor = async () => {
                if (!anchorUrl.trim()) { addLog("error", "[ANCHOR] Provide a login/refresh URL first."); return; }
                setDryRunning(true);
                setDryRunResult(null);
                addLog("info", "[ANCHOR \u00b7 DRY-RUN] Testing identity provider refresh request...");
                try {
                    const resp = await fetch(`${API_BASE_URL}/api/v1/hunter/auth/dry-run`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ auth_refresh_request: buildAnchorRequest(), approved_host: null }),

                    const data = await resp.json();
                    setDryRunResult(data);
                    addLog(data.success ? "success" : "error", `[ANCHOR \u00b7 DRY-RUN] ${data.message}`);
                } catch (e) {
                    setDryRunResult({ success: false, message: e.message });
                    addLog("error", `[ANCHOR \u00b7 DRY-RUN] ${e.message}`);
                } finally {
                    setDryRunning(false);
                    setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 100);

            const handleBatchFuzz = async () => {
                if (selectedFindingIds.length === 0) return;
                setBatchActive(true);
                setHunterFuzzRecords([]);
                setReauthDiagnostic(null);
                const primaryId = selectedFindingIds[0];

                        headers: { "Content-Type": "application/json" },

                            finding_ids: selectedFindingIds.map(Number),
                            approved_host: null,
                            auth_refresh_request: anchor,
                            max_concurrency: 5,
                        }),

                    if (!resp.ok) {
                        const err = await resp.json().catch(() => ({ detail: `HTTP ${resp.status}` }));
                        throw new Error(err.detail || "Batch trigger failed");
                    }
                    const data = await resp.json();
                    addLog("success", `[BATCH] Accepted. Locked to host '${data.approved_host}'. Polling all selected findings...`);
                    if (hunterPollRef.current) clearInterval(hunterPollRef.current);
                    hunterPollRef.current = setInterval(async () => {
                        try {
                            let anyDiag = null;
                            let primaryRecords = [];
                            for (const fid of selectedFindingIds) {
                                const pr = await fetch(`${API_BASE_URL}/api/v1/hunter/verify/${fid}/results`);
                                if (!pr.ok) continue;
                                const recs = await pr.json();
                                const diag = recs.find(r => r.payload_index === -1 || r.id === "__custody_diagnostic__");
                                if (diag) {
                                    anyDiag = diag.diff_details?.analysis_notes
                                        || "[RE-AUTHENTICATING] Session expired; executing dynamic auth recovery...";
                                }
                                if (String(fid) === String(primaryId)) {
                                    primaryRecords = recs.filter(r => r.payload_index >= 0 && r.id !== "__custody_diagnostic__");
                                }
                            }
                            setReauthDiagnostic(anyDiag);
                            setHunterFuzzRecords(primaryRecords.map(r => ({ ...r, _statusBadge: r.verification_status || "untested" })));
                        } catch (e) { console.warn("[BATCH POLL]", e); }
                    }, 1500);
                    setTimeout(() => {
                        if (hunterPollRef.current) {
                            clearInterval(hunterPollRef.current);
                            hunterPollRef.current = null;
                            setBatchActive(false);
                            setReauthDiagnostic(null);
                            addLog("info", "[BATCH] Polling completed.");
                        }

                    addLog("error", `[BATCH] ${e.message}`);
                    setBatchActive(false);
                }

            // ========== HAR Upload Handler ==========
            const handleHarUpload = async (file) => {
                if (!file) return;
                setHarFileName(file.name);
                setHarUploading(true);
                setHarError(null);
                setHarResults(null);
                addLog("info", `[HUNTER \u00b7 HAR] Uploading file: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`);

                try {
                    const formData = new FormData();
                    formData.append("file", file);
                    formData.append("threshold", "0.65");

                    const response = await fetch(`${API_BASE_URL}/api/v1/hunter/ingest-har-file`, {
                        method: "POST",
                        body: formData,
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({ detail: `HTTP ${response.status}` }));
                        throw new Error(err.detail || `Server returned ${response.status}`);
                    }

                    const data = await response.json();

                    if (data.status === "error") {
                        throw new Error(data.error_message || "Backend returned error status.");

                    setHarResults(data);
                    addLog("success", `[HUNTER \u00b7 HAR] Pruning complete: ${data.total_entries} entries \u2192 ${data.filtered_count} high-value targets.`);

                                                                                                                                    className={`px-3 py-0.5 ${

                                                                                                                                        line.type === "del" ? "diff-line-del" :
                                                                                                                                        "diff-line-ctx"
                                                                                                                                    }`}
                                                                                                                                >
                                                                                                                                    <span className="select-none opacity-60 mr-2">
                                                                                                                                        {line.type === "add" ? "+" : line.type === "del" ? "-" : " "}
                                                                                                                                    </span>
                                                                                                                                    {line.content}
                                                                                                                                </div>
                                                                                                                            ))}
                                                                                                                        </pre>
                                                                                                                    </div>
                                                                                                                </div>
                                                                                                            );
                                                                                                        })()}
                                                                                                    </div>
                                                                                                )}
                                                                                            </div>
                                                                                        )}
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </>
                                                    )}
                                                </div>
                                            )}

                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB 3: SYSTEM CONTEXT VIEWS */}
                            {activeTab === "configs" && (
                                <div className="max-w-2xl space-y-6 animate-fadeIn">

                                                FastAPI Configuration Dashboard / &#x7CFB;&#x7EDF;&#x73AF;&#x5883;&#x53C2;&#x6570;&#x914D;&#x7F6E;

                                        <div className="space-y-4">
                                            <div className="p-4 bg-slate-50 border border-slate-200 rounded-lg flex items-center justify-between">
                                                <div>
                                                    <h4 className="text-xs font-bold text-slate-700">FastAPI API Service Port / &#x540E;&#x7AEF;&#x76D1;&#x542C;&#x7AEF;&#x53E3;</h4>
                                                    <p className="text-[10px] text-slate-500 mt-0.5">API_PORT read dynamically on server runtime config.</p>

                                            <div className="p-4 bg-slate-50 border border-slate-200 rounded-lg flex items-center justify-between">

                                                    <h4 className="text-xs font-bold text-slate-700">Local Nuclei Binary Path / &#x626B;&#x63CF;&#x5668;&#x8DEF;&#x5F84;</h4>
                                                    <p className="text-[10px] text-slate-500 mt-0.5">Absolute system execution binary path validation.</p>
                                                </div>
                                                <span className="font-mono text-[10px] bg-white border border-slate-200 px-3 py-1 rounded font-bold text-emerald-700 max-w-xs truncate">
                                                    C:\\tools\\nuclei.exe
                                                </span>
                                            </div>

                                            <div className="p-4 bg-slate-50 border border-slate-200 rounded-lg flex items-center justify-between">
                                                <div>
                                                    <h4 className="text-xs font-bold text-slate-700">FastAPI Logger Output Level / &#x65E5;&#x5FD7;&#x7EA7;&#x522B;</h4>
                                                    <p className="text-[10px] text-slate-500 mt-0.5">LOG_LEVEL settings for diagnostics reporting.</p>
                                                </div>
                                                <span className="font-mono text-xs bg-white border border-slate-200 px-3 py-1 rounded font-bold text-indigo-600">
                                                    INFO
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        // Render application and initialize Lucide icons
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Trigger lucide icon processing after DOM updates
        setTimeout(() => {
            lucide.createIcons();
        }, 300);
    </script>
</body>
